<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<title>Пробник шрифта – Burger House</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--senf:#F4B731;--grill:#211A14;--ketchup:#D23A26;--weiss:#FFFDF8}
*{box-sizing:border-box}
body{margin:0;background:var(--senf);color:var(--grill);font:500 16px/1.5 Figtree,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 40px}
h2{font:800 14px Figtree,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px}
.buehne{background:radial-gradient(circle at 70% 50%,rgba(255,232,170,.7),rgba(255,232,170,0) 60%);border:2.5px solid var(--grill);border-radius:18px;padding:30px 28px;margin-bottom:18px;overflow:hidden}
.titel{font-family:"Lilita One",Impact,sans-serif;text-transform:uppercase;line-height:.92;letter-spacing:.03em;margin:0;font-weight:400}
.titel span{display:block}
.titel i{display:inline-block;font-style:normal;transform-origin:0 0}
.gross .titel{font-size:clamp(58px,9vw,122px)}
.klein{width:375px;max-width:100%}
.klein .titel{font-size:50px}
.regler{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px;background:var(--weiss);border:2.5px solid var(--grill);border-radius:18px;padding:20px 22px}
.gruppe h3{margin:0 0 10px;font:800 17px Figtree,system-ui,sans-serif}
label{display:grid;grid-template-columns:9.5em 1fr 4.2em;align-items:center;gap:10px;font-weight:700;margin:10px 0}
input[type=range]{width:100%;accent-color:#D23A26;height:28px}
output{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.werte{grid-column:1/-1;margin:6px 0 0;padding:12px 14px;border-radius:12px;background:#FFF3D0;font:700 15px/1.5 Figtree,system-ui,sans-serif;word-break:break-word}
.knoepfe{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px}
button{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--grill);background:var(--weiss);font:800 15px Figtree,system-ui,sans-serif;cursor:pointer;transition:background-color .2s ease,box-shadow .2s ease}
button:hover{background:#FFF1C9;box-shadow:0 0 0 5px rgba(255,211,107,.45)}
.zwei{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
@media (max-width:820px){.regler{grid-template-columns:1fr}.zwei{grid-template-columns:1fr}label{grid-template-columns:8em 1fr 3.6em}}
</style>
</head>
<body>
<div class="wrap">
  <h2>Пробник надписи · Lilita One</h2>
  <p style="margin:0 0 14px">Двигай ползунки: «ширина» тянет буквы вправо, «высота» делает ниже, «жирность» утолщает ровным контуром того же цвета. Тень у HOUSE идёт по контуру и пересчитывается сама.</p>
  <div class="zwei">
    <div class="buehne gross"><h1 class="titel" id="t1"><span class="w1"><i>Burger</i></span><span class="w2"><i>House</i></span></h1></div>
    <div class="buehne klein"><div style="font:700 12px Figtree,system-ui,sans-serif;margin-bottom:8px">как на телефоне</div><div class="titel" id="t2"><span class="w1"><i>Burger</i></span><span class="w2"><i>House</i></span></div></div>
  </div>
  <div class="regler">
    <div class="gruppe"><h3>BURGER</h3>
      <label>ширина <input type="range" id="bx" min="0.9" max="1.45" step="0.01"><output id="obx"></output></label>
      <label>высота <input type="range" id="by" min="0.65" max="1.1" step="0.01"><output id="oby"></output></label>
      <label>жирность <input type="range" id="bf" min="0" max="0.045" step="0.001"><output id="obf"></output></label>
    </div>
    <div class="gruppe"><h3>HOUSE</h3>
      <label>ширина <input type="range" id="hx" min="0.9" max="1.45" step="0.01"><output id="ohx"></output></label>
      <label>высота <input type="range" id="hy" min="0.65" max="1.1" step="0.01"><output id="ohy"></output></label>
      <label>жирность <input type="range" id="hf" min="0" max="0.045" step="0.001"><output id="ohf"></output></label>
      <label>тень <input type="range" id="hs" min="0" max="0.09" step="0.002"><output id="ohs"></output></label>
    </div>
    <div class="knoepfe">
      <button type="button" data-v="1.14,0.91,0.016,1.14,0.91,0.016,0.048">Как сейчас на сайте</button>
      <button type="button" data-v="1,1,0,1,1,0,0.045">Обычный Lilita (D)</button>
      <button type="button" data-v="1.25,0.84,0.024,1.25,0.84,0.024,0.055">Широкий и приплюснутый</button>
    </div>
    <p class="werte" id="werte"></p>
  </div>
</div>
<script>
(function(){
  var ids=["bx","by","bf","hx","hy","hf","hs"],el={};ids.forEach(function(i){el[i]=document.getElementById(i);});
  function ring(r,ox,oy,col,n){var a=[];for(var k=0;k<n;k++){var t=2*Math.PI*k/n;a.push((ox+r*Math.cos(t)).toFixed(4)+"em "+(oy+r*Math.sin(t)).toFixed(4)+"em 0 "+col);}return a;}
  function anwenden(){
    var v={};ids.forEach(function(i){v[i]=parseFloat(el[i].value);document.getElementById("o"+i).textContent=(i.slice(1)==="f"||i==="hs")?(v[i]*100).toFixed(1)+"%":Math.round(v[i]*100)+"%";});
    var dunkel=v.bf>0?ring(v.bf*.5,0,0,"#211A14",24).concat(ring(v.bf,0,0,"#211A14",24)):[];
    var rot=v.hf>0?ring(v.hf*.5,0,0,"#D23A26",24).concat(ring(v.hf,0,0,"#D23A26",24)):[];
    var sch=[];if(v.hs>0){[.25,.5,.75,.94].forEach(function(q){sch=sch.concat(ring(v.hf,v.hs*q,v.hs*q,"#211A14",16));});sch=sch.concat(ring(v.hf+.012,v.hs,v.hs,"#211A14",24));}
    ["t1","t2"].forEach(function(id){
      var t=document.getElementById(id),b=t.querySelector(".w1 i"),h=t.querySelector(".w2 i");
      b.style.color="#211A14";h.style.color="#D23A26";
      b.style.transform="scale("+v.bx+","+v.by+")";b.style.marginBottom="calc("+(v.by-1)+"*.92em)";b.style.textShadow=dunkel.join(",")||"none";
      h.style.transform="scale("+v.hx+","+v.hy+")";h.style.marginBottom="calc("+(v.hy-1)+"*.92em)";h.style.textShadow=rot.concat(sch).join(",")||"none";
    });
    document.getElementById("werte").textContent="BURGER: ширина "+Math.round(v.bx*100)+"%, высота "+Math.round(v.by*100)+"%, жирность "+(v.bf*100).toFixed(1)+"% · HOUSE: ширина "+Math.round(v.hx*100)+"%, высота "+Math.round(v.hy*100)+"%, жирность "+(v.hf*100).toFixed(1)+"%, тень "+(v.hs*100).toFixed(1)+"%";
  }
  function setzen(s){s.split(",").forEach(function(x,k){el[ids[k]].value=x;});anwenden();}
  ids.forEach(function(i){el[i].addEventListener("input",anwenden);});
  [].forEach.call(document.querySelectorAll("button[data-v]"),function(b){b.addEventListener("click",function(){setzen(b.dataset.v);});});
  setzen("1.14,0.91,0.016,1.14,0.91,0.016,0.048");
})();
</script>
</body>
</html>
